<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIX – Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --nix-primary: #19599F;
      --nix-primary-hover: #144a7d;
      --nix-primary-light: rgba(25, 89, 159, 0.08);
      --nix-accent: #579eee;
      --nix-bg: #f8fafc;
      --nix-card: #ffffff;
      --nix-text: #0f172a;
      --nix-text-muted: #475569;
      --nix-border: #e2e8f0;
      --nix-input-bg: #f8fafc;
      --nix-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
      --nix-shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --nix-radius: 12px;
      --nix-radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      background: var(--nix-bg);
      color: var(--nix-text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      /* Fondo sutil: gradiente + patrón opcional */
      background-image:
        radial-gradient(ellipse 100% 80% at 50% -30%, var(--nix-primary-light), transparent 55%),
        linear-gradient(180deg, var(--nix-bg) 0%, #f1f5f9 100%);
    }

    .page-anonymous {
      width: 100%;
      max-width: 440px;
    }

    .card-md {
      background: var(--nix-card);
      border: 1px solid var(--nix-border);
      border-radius: var(--nix-radius-lg);
      box-shadow: var(--nix-shadow-lg);
      overflow: hidden;
    }

    .card-body {
      padding: 2.25rem 2rem;
    }

    /* Logo y título */
    .logo-wrap {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .logo-wrap a {
      display: inline-block;
      text-decoration: none;
      color: inherit;
    }

    .logo-img {
      height: 52px;
      width: auto;
      max-width: 220px;
      object-fit: contain;
      display: block;
      margin: 0 auto 1.25rem;
    }

    .logo-placeholder {
      height: 52px;
      max-width: 220px;
      margin: 0 auto 1.25rem;
      background: var(--nix-input-bg);
      border: 1px dashed var(--nix-border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--nix-text);
      font-size: 0.8rem;
      font-weight: 500;
    }

    .title-app {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--nix-primary);
      margin-bottom: 0.25rem;
    }

    .subtitle-app {
      font-size: 0.9375rem;
      color: var(--nix-text-muted);
      font-weight: 500;
    }

    /* Formulario */
    form {
      margin-top: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.125rem;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--nix-text);
      margin-bottom: 0.375rem;
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-family: inherit;
      color: var(--nix-text);
      background: var(--nix-input-bg);
      border: 1px solid var(--nix-border);
      border-radius: var(--nix-radius);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control::placeholder {
      color: var(--nix-text-muted);
      opacity: 1;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--nix-accent);
      box-shadow: 0 0 0 3px var(--nix-primary-light);
    }

    .form-footer {
      margin-top: 1.5rem;
      margin-bottom: 1rem;
    }

    .btn-primary {
      width: 100%;
      padding: 0.875rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      color: #fff;
      background: var(--nix-primary);
      border: none;
      border-radius: var(--nix-radius);
      cursor: pointer;
      transition: background 0.2s, transform 0.05s;
      box-shadow: var(--nix-shadow);
    }

    .btn-primary:hover {
      background: var(--nix-primary-hover);
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    .form-label-description {
      display: block;
      text-align: center;
      margin-top: 0.75rem;
    }

    .form-label-description a {
      font-size: 0.875rem;
      color: var(--nix-accent);
      text-decoration: none;
      font-weight: 500;
    }

    .form-label-description a:hover {
      text-decoration: underline;
    }

    .form-check {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.75rem;
      font-size: 0.875rem;
      color: var(--nix-text);
      cursor: pointer;
    }

    .form-check-input {
      width: 1.125rem;
      height: 1.125rem;
      accent-color: var(--nix-primary);
    }

    .divider {
      height: 1px;
      background: var(--nix-border);
      margin: 1.5rem 0;
    }

    /* Redes sociales */
    .social-label {
      font-size: 0.8125rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--nix-text);
      margin-bottom: 0.75rem;
      text-align: center;
    }

    .iconosredes {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .iconosredes a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--nix-input-bg);
      border: 1px solid var(--nix-border);
      color: var(--nix-text-muted);
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .iconosredes a:hover {
      background: var(--nix-primary-light);
      border-color: var(--nix-accent);
      color: var(--nix-primary);
    }

    .iconosredes svg {
      width: 22px;
      height: 22px;
    }

    /* Política de datos */
    .politicapd {
      text-align: center;
      margin-top: 1.25rem;
    }

    .politicapd a {
      font-size: 0.875rem;
      color: var(--nix-primary);
      text-decoration: none;
      font-weight: 500;
    }

    .politicapd a:hover {
      color: var(--nix-primary);
      text-decoration: underline;
    }

    .footer-muted {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.8125rem;
      color: var(--nix-text);
    }
  </style>
</head>
<body>
  <div class="page-anonymous">
    <div class="card-md">
      <div class="card-body">
        <div class="logo-wrap">
          <a href="https://supplies.com.co" target="_blank" rel="noopener">
            <!-- Sustituir por: <img src="../pics/logopnghorizontal.png" class="logo-img" alt="Supplies" /> -->
            <div class="logo-placeholder">Logo Supplies (logopnghorizontal.png)</div>
          </a>
          <h2 class="title-app">NIX</h2>
          <p class="subtitle-app">Iniciar sesión en su cuenta</p>
        </div>

        <form action="#" method="post" autocomplete="off">
          <input type="hidden" name="noAUTO" value="" />
          <input type="hidden" name="redirect" value="" />
          <input type="hidden" name="_glpi_csrf_token" value="" />

          <div class="form-group">
            <label for="login_name">Usuario</label>
            <input type="text" id="userid" class="form-control" name="login_name" placeholder="Usuario" tabindex="1" />
          </div>
          <div class="form-group">
            <label for="login_password">Contraseña</label>
            <input type="password" id="contrasupp" class="form-control" name="login_password" placeholder="Contraseña" autocomplete="off" tabindex="2" />
          </div>

          <div class="form-footer">
            <button type="submit" name="submit" class="btn-primary" tabindex="3">Iniciar sesión</button>
          </div>

          <div class="form-label-description">
            <a href="#">¿Olvidó su contraseña?</a>
          </div>

          <label class="form-check" for="login_remember">
            <input type="checkbox" class="form-check-input" id="login_remember" name="login_remember" />
            <span class="form-check-label">Recordarme</span>
          </label>

          <div class="divider"></div>

          </div>

          <div class="politicapd">
            <a href="https://www.supplies.com.co/politica-de-proteccion-de-datos-nix/" target="_blank" rel="noopener">Política de protección de datos</a>
          </div>
        </form>
      </div>
    </div>

    <p class="footer-muted">NIX · Supplies de Colombia</p>
  </div>
</body>
</html>
